<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إسناد — لوحة التحكم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="app-shell">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar__brand">
        <div class="sidebar__brand-logo">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 9h14M5 14h14M5 19h10" stroke-linecap="round"/></svg>
        </div>
        <div>
          <b>إسناد</b>
          <small id="sbCompany">شركة الإسناد للتقنية</small>
        </div>
      </div>

      <nav class="sidebar__nav" id="sbNav">
        <!-- populated by app.js based on role -->
      </nav>

      <div class="sidebar__user">
        <div class="avatar av-1" id="sbAvatar">AS</div>
        <div class="sidebar__user-info">
          <b id="sbUser">عبدالعزيز السبيعي</b>
          <small id="sbUserRole">مدير الشركة</small>
        </div>
        <button class="sidebar__logout" id="logoutBtn" title="تسجيل الخروج">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
    </aside>

    <!-- MAIN -->
    <div>
      <header class="topbar">
        <div class="topbar__breadcrumb" id="bcrumb">
          <b>لوحة التحكم</b>
        </div>

        <div class="topbar__search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="بحث في المهام والمشاريع..." id="globalSearch" />
        </div>

        <div class="calendar-toggle no-print">
          <button class="active" data-cal="greg" id="calGreg">ميلادي</button>
          <button data-cal="hijri" id="calHijri">هجري</button>
        </div>

        <div class="topbar__actions">
          <div class="dropdown">
            <button class="topbar__btn" id="notifBtn" title="الإشعارات">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <span class="topbar__btn-dot"></span>
            </button>
            <div class="dropdown__menu" id="notifMenu">
              <div style="padding: 8px 12px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 13px;">الإشعارات</div>
              <div id="notifList"></div>
            </div>
          </div>
          <button class="topbar__btn" id="resetBtn" title="إعادة تعيين البيانات التجريبية">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          </button>
        </div>
      </header>

      <main class="main" id="appMain">
        <!-- View renders here -->
      </main>
    </div>
  </div>

  <!-- Drawer (task detail) -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <div class="drawer" id="drawer">
    <div class="drawer__head">
      <h3 id="drawerTitle">تفاصيل المهمة</h3>
      <button class="drawer__close" id="drawerClose">✕</button>
    </div>
    <div class="drawer__body" id="drawerBody"></div>
    <div class="drawer__foot" id="drawerFoot"></div>
  </div>

  <!-- Modal (forms) -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal__head">
        <h3 id="modalTitle"></h3>
        <button class="drawer__close" id="modalClose">✕</button>
      </div>
      <div class="modal__body" id="modalBody"></div>
      <div class="modal__foot" id="modalFoot"></div>
    </div>
  </div>

  <!-- Toasts -->
  <div class="toasts" id="toasts"></div>

  <!-- Chat widget (full mode) -->
  <button class="chat-fab no-print" id="chatFab" title="المساعد الذكي">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </button>
  <div class="chat-pop" id="chatPop" hidden>
    <div class="chat-pop__head">
      <div class="chat-pop__avatar">إ</div>
      <div>
        <b>المساعد الذكي</b>
        <small>متاح الآن · يرد فوراً</small>
      </div>
      <button class="chat-pop__close" id="chatClose">✕</button>
    </div>
    <div class="chat-pop__body" id="chatBody"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
